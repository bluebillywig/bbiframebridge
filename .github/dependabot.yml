# Dependabot version updates. Copied from the BB baseline template at
# bluebillywig/gh-workflows:template-workflows/dependabot.yml (ADO #19329).
#
# `cooldown` holds back PRs for newly published versions (3 days, all version
# classes) so a freshly compromised release ages out before we pull it in.
version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3
      semver-minor-days: 3
      semver-patch-days: 3
    groups:
      # Minor and patch bumps land in one PR; majors get their own. A runtime
      # change is not reliably a major, so read the grouped PR rather than
      # rubber-stamping it.
      minor-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # github-actions only supports default-days — Dependabot rejects the
    # semver-* cooldown properties for this ecosystem.
    cooldown:
      default-days: 3
    groups:
      actions:
        patterns:
          - '*'
    ignore:
      # First-party actions are referenced by a floating tag (@v1) BY DESIGN —
      # the tag is protected at the source rather than pinned by consumers.
      - dependency-name: 'bluebillywig/*'
